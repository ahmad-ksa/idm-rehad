name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        shell: bash
        run: echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Compile (all errors)
        shell: bash
        run: |
          set -o pipefail
          dotnet build src/Rehad/Rehad.csproj -c Release 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "error [A-Z]+[0-9]+" build.log | sed -E 's/ \[[^]]*\]\s*$//; s/^.*\\src\\/src\\/' | sort -u | head -150 > errors.txt || true
          [ -s errors.txt ] || tail -80 build.log > errors.txt
          gh issue create --repo ${{ github.repository }} --title "CI build errors run ${{ github.run_number }}" --body-file errors.txt

      - name: Publish app (self-contained, single file)
        run: dotnet publish src/Rehad/Rehad.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=${{ env.VERSION }} -o out/app

      - name: Publish browser helper (native AOT)
        shell: bash
        run: |
          dotnet publish src/RehadHost/RehadHost.csproj -c Release -r win-x64 -p:PublishAot=true -o out/host || \
          dotnet publish src/RehadHost/RehadHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o out/host
          cp out/host/RehadHost.exe out/app/

      - name: Download yt-dlp, FFmpeg, Deno and aria2
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          # folder build of yt-dlp: starts much faster than the single exe (no unpacking on every run)
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_win.zip -OutFile ytdlp.zip
          Expand-Archive ytdlp.zip -DestinationPath ytdlp_x
          $exe = Get-ChildItem ytdlp_x -Recurse -Filter yt-dlp.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force out/app/yt-dlp | Out-Null
          Copy-Item "$($exe.DirectoryName)\*" out/app/yt-dlp -Recurse
          # aria2: many connections per video file
          Invoke-WebRequest https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip -OutFile aria2.zip
          Expand-Archive aria2.zip -DestinationPath aria2_x
          Copy-Item (Get-ChildItem aria2_x -Recurse -Filter aria2c.exe | Select-Object -First 1).FullName out/app/aria2c.exe
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          Copy-Item (Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName out/app/ffmpeg.exe
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath deno
          Copy-Item deno/deno.exe out/app/deno.exe

      - name: Add browser extensions
        shell: bash
        run: |
          mkdir -p out/app/extension out/app/extension-firefox
          cp -r extension/* out/app/extension/
          rm out/app/extension/manifest.firefox.json
          cp -r extension/* out/app/extension-firefox/
          mv -f out/app/extension-firefox/manifest.firefox.json out/app/extension-firefox/manifest.json
          sed -i "s/\"version\": \"1.0.0\"/\"version\": \"${VERSION}\"/" out/app/extension/manifest.json out/app/extension-firefox/manifest.json
          (cd out/app/extension && 7z a -tzip ../../Rehad-Chrome-Edge-extension.zip . > /dev/null)
          (cd out/app/extension-firefox && 7z a -tzip ../../Rehad-Firefox-extension.xpi . > /dev/null)
          ls -la out out/app

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer\rehad.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Rehad
          path: |
            out/Rehad-Setup-*.exe
            out/Rehad-Chrome-Edge-extension.zip
            out/Rehad-Firefox-extension.xpi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Rehad ${{ env.VERSION }}
          files: |
            out/Rehad-Setup-*.exe
            out/Rehad-Chrome-Edge-extension.zip
            out/Rehad-Firefox-extension.xpi
